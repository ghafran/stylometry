[project]
name = "stylometry"
version = "0.1.0"
description = "Verse-level stylometry and author discovery for Codex Sinaiticus and early Christian apocrypha"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.6",
    "lxml>=5",
    "numpy>=1.26",
    "pandas>=2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "hdbscan>=0.8",
    "openai>=3.14.1",
    "text-fabric>=13.1.0",
]

[project.scripts]
stylometry = "stylometry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stylometry"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "empirical: real reference-author acceptance gate (opt-in with --run-empirical; needs cached benchmark data)",
]
