[project]
name = "stylometry"
version = "0.2.0"
description = "Language-scoped authorship discovery and verse explorer"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "lxml>=5", "text-fabric>=13.1",
]

[project.scripts]
stylometry = "stylometry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stylometry"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
